{% extends "layout.html" %}
{% block content %}
    {% if current_user %}
     <div class="container my-5 " style="font-family:  Tahoma, Geneva, Verdana, sans-serif;">
        <h3> ADD ACCOUNT</h3>
        <form method="POST" action="/Dashboard/">
            <div class="mb-3">
                <label for="text" class="form-label">Name of Account</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="Tiktok Account" required>
            </div>
            <div class="mb-3">
                <label for="text" class="form-label">Price</label>
                <input type="text" class="form-control" id="price" name="price" placeholder="₦200" required>
            </div>
                <div class="mb-3">
                    <label for="text" class="form-label">Account in Stock</label>
                    <input type="text" class="form-control" id="amount_in_stock" name="amount_in_stock" placeholder="2" required>
                </div>
                <div class="mb-3">
                    <label for="text" class="form-label">Amount Sold</label>
                    <input type="text" class="form-control" id="amount_sold" name="amount_sold" placeholder="2" required>
                </div>
          
            <div class="container my-5 " style="font-family:  Tahoma, Geneva, Verdana, sans-serif;">  
                <div class="d-flex justify-content-between align-items-center">
                    <button type="submit" class="btn btn-dark" onclick="window.history.back()">Back</button>
                <div class="d-flex justify-content-end gap-3 ms-auto" style="width: 300px; height: auto ;">
                    <button type="submit" class="btn btn-danger ">Save</button>
                    
                </div>
    {% else %}
    <div class="container my-5">
        <p>create have an admin account.</p>
    </div>
    {% endif %}
{%endblock%}
