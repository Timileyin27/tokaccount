<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TocAccount</title>
</head>
<body>
    <div class="container my-5" style="padding-top: 100px;">
        <div class="row ">
            <div class="col">
             
                <img src="{{ url_for('static', path='vector.png') }}" alt="">
            </div>
            <div class="col" >
                <h1 class="text-left">Create Account</h1>
                <form method="POST" action="/users">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="text" class="form-control" id="email" name="email" placeholder="user12@gmail.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="confirm password" required>
                    </div><br>
                    <button type="submit" class="btn btn-dark w-100">Create Account</button>
                    <br><br>
                    <p style="text-align: center; color: #000;"> Already have Account?  <a href="/login" style="color: red ; text-decoration: underline;"> Sign In </a> </p>
            </div>
        </div>
        {% if message %}
            <p style="color:red;">{{ message }}</p>
        {% endif %}
        
    </div>
   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
