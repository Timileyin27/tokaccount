<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TocAccount</title>
    <style>
     
            .accounts-section {
                padding: 80px 10%;
            }

            .account-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 60px;
                margin-bottom: 120px;
            }

            .account-row.reverse {
                flex-direction: row-reverse;
            }

            .account-image img {
                width: 100%;
                max-width: 450px;
                border-radius: 20px;
                box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            }

            .account-content {
                max-width: 500px;
            }

            .account-content h2 {
                font-size: 42px;
                font-weight: 700;
                margin-bottom: 25px;
            }

            .highlight {
                font-size: 24px;
                font-weight: 600;
                color: #ff3c3c;
                margin-bottom: 15px;
            }

            .subtext {
                font-size: 18px;
                color: #6c757d;
                margin-bottom: 30px;
            }

            .btn {
                    padding: 14px 40px;
                    border: none;
                    border-radius: 50px;
                    font-size: 16px;
                    font-weight: 600;
                    transition: all 0.3s ease;
                    cursor: pointer;
                }
            .wording{
                font-size: 16px;
                color: black;
                margin-bottom: 15px;
            }
            .rating-head{
                font-size: 16px;
                font-weight: bold;
                color: black;
                margin-bottom: 10px;
            }
            .rating-body{
                font-size: 13px;
                color: #6c757d;
                margin-bottom: 10px;
            }
            .rating-score{
                font-size: 13px;
                font-weight: bold;
                color: gold;
                margin-bottom: 10px;
            }
            .rating-name{
                font-size: 10px;
                color: gray
            }
            .hero {
                min-height: 90vh;
                background: linear-gradient(135deg, #4f46e5, #3b82f6);
                color: white;
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding: 2rem 1rem;
            }

            .hero h1 {
                font-size: clamp(2rem, 5vw, 4rem);
                line-height: 1.2;
            }

            .hero p {
                font-size: 1.25rem;
                max-width: 700px;
                margin: 0 auto 2rem auto;
            }

            .hero .btn-primary {
                background-color: #ec4899;
                border: none;
                transition: background-color 0.3s ease, transform 0.2s ease;
            }

            .hero .btn-primary:hover {
                background-color: #db2777;
                transform: translateY(-2px);
            }

            .hero .btn-outline-light {
                border-color: rgba(255,255,255,0.7);
                color: rgba(255,255,255,0.9);
                transition: background-color 0.3s ease, color 0.3s ease;
            }

            .hero .btn-outline-light:hover {
                background-color: rgba(255,255,255,0.2);
                color: white;
            }
            .dark-footer {
                height: 200px; 
                background-color: #0f172a; 
            }


            
    </style>
</head>
<body>
   
   {% block content %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
